<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiya | 로그인</title>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: linear-gradient(160deg,#f0f2ff,#ece9ff 40%,#f5eeff 75%,#fff0fb);
        --card-bg: rgba(255,255,255,0.88);
        --card-shadow: 0 8px 40px rgba(99,102,241,0.12), 0 1px 0 rgba(255,255,255,0.6) inset;
        --card-border: rgba(139,92,246,0.18);
        --text: #1e1b3a;
        --muted: #6b7280;
        --sub: #9ca3af;
        --input-bg: rgba(255,255,255,0.7);
        --input-border: rgba(99,102,241,0.22);
        --divider: rgba(139,92,246,0.1);
        --primary: #6366f1;
        --secondary: #8b5cf6;
        --ring: rgba(99,102,241,0.2);
        --err-bg: rgba(220,38,38,0.07);
        --err-text: #dc2626;
        --ok-bg: rgba(22,163,74,0.07);
        --ok-text: #16a34a;
      }
      [data-theme="dark"] {
        --bg: linear-gradient(160deg,#08070f,#0e0b1c 40%,#12091e 75%,#140b1c);
        --card-bg: rgba(18,15,38,0.9);
        --card-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 1px 0 rgba(167,139,250,0.07) inset;
        --card-border: rgba(167,139,250,0.2);
        --text: #e2e0f0;
        --muted: #9ca3af;
        --sub: #6b7280;
        --input-bg: rgba(14,11,28,0.8);
        --input-border: rgba(129,140,248,0.28);
        --divider: rgba(167,139,250,0.12);
        --primary: #818cf8;
        --secondary: #a78bfa;
        --ring: rgba(129,140,248,0.25);
        --err-bg: rgba(220,38,38,0.12);
        --err-text: #f87171;
        --ok-bg: rgba(22,163,74,0.12);
        --ok-text: #4ade80;
      }
      *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
      body {
        font-family:"Noto Sans KR",system-ui,sans-serif;
        min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:var(--bg); padding:20px; color:var(--text);
        transition: background 0.3s;
      }
      .wrap {
        background:var(--card-bg); border:1px solid var(--card-border);
        border-radius:24px; box-shadow:var(--card-shadow);
        width:100%; max-width:400px; padding:44px 40px 36px;
        position:relative; backdrop-filter:blur(20px);
      }
      .back-link {
        position:absolute; top:18px; left:22px;
        display:flex; align-items:center; gap:5px;
        font-size:12px; color:var(--sub); text-decoration:none; transition:color 0.2s;
      }
      .back-link:hover { color:var(--primary); }
      .brand {
        font-family:"Space Grotesk",sans-serif;
        text-align:center; font-size:30px; font-weight:800;
        letter-spacing:3px; margin-bottom:4px;
        background:linear-gradient(135deg,var(--primary),var(--secondary));
        -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      }
      .brand-sub { text-align:center; font-size:12px; color:var(--sub); margin-bottom:28px; }
      .view-title { font-size:15px; font-weight:700; color:var(--text); margin-bottom:20px; text-align:center; }
      .field { margin-bottom:14px; }
      .field label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; }
      .field input {
        width:100%; padding:11px 14px;
        border:1.5px solid var(--input-border); border-radius:10px;
        font-size:14px; font-family:inherit; color:var(--text);
        background:var(--input-bg); transition:border-color 0.2s,box-shadow 0.2s;
      }
      .field input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--ring); }
      .field input::placeholder { color:var(--sub); }
      .field-hint { font-size:11px; color:var(--sub); margin-top:4px; }
      .btn {
        width:100%; padding:12px;
        background:linear-gradient(135deg,var(--primary),var(--secondary));
        color:#fff; border:none; border-radius:10px;
        font-size:14px; font-weight:700; font-family:inherit; cursor:pointer;
        margin-top:6px; transition:opacity 0.2s,transform 0.15s;
        box-shadow:0 4px 16px rgba(99,102,241,0.35);
      }
      .btn:hover:not(:disabled) { opacity:0.9; transform:translateY(-1px); }
      .btn:disabled { opacity:0.55; cursor:not-allowed; transform:none; }
      .link-row { display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
      .text-btn {
        background:none; border:none; box-shadow:none; margin:0; padding:0;
        font-size:12px; color:var(--muted); cursor:pointer;
        font-family:inherit; text-decoration:underline; text-underline-offset:2px;
        transition:color 0.2s;
      }
      .text-btn:hover { color:var(--primary); transform:none; }
      .text-btn.accent { color:var(--primary); font-weight:600; }
      .toggle-row {
        text-align:center; margin-top:18px; padding-top:16px;
        font-size:13px; color:var(--muted);
        border-top:1px solid var(--divider);
      }
      .alert { padding:10px 14px; border-radius:9px; font-size:13px; margin-bottom:14px; display:none; }
      .alert.show { display:block; }
      .alert-error { background:var(--err-bg); color:var(--err-text); border-left:3px solid var(--err-text); }
      .alert-success { background:var(--ok-bg); color:var(--ok-text); border-left:3px solid var(--ok-text); }
      .view { display:none; }
      .view.active { display:block; }
      .step-bar { display:flex; gap:6px; justify-content:center; margin-bottom:18px; }
      .step-dot { width:7px; height:7px; border-radius:50%; background:var(--input-border); transition:background 0.2s; }
      .step-dot.on { background:var(--primary); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a href="/" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        메인으로
      </a>

      <div class="brand">AUDIYA</div>
      <div class="brand-sub">나만의 음악 취향 분석</div>

      <div id="alertError" class="alert alert-error"></div>
      <div id="alertSuccess" class="alert alert-success"></div>

      <div id="viewLogin" class="view active">
        <div class="view-title">로그인</div>
        <form id="loginForm">
          <div class="field"><label>아이디</label><input id="loginUsername" type="text" placeholder="아이디 입력" autocomplete="username" /></div>
          <div class="field"><label>비밀번호</label><input id="loginPassword" type="password" placeholder="비밀번호 입력" autocomplete="current-password" /></div>
          <button type="submit" class="btn" id="loginBtn">로그인</button>
        </form>
        <div class="link-row">
          <button class="text-btn" id="showResetBtn">비밀번호 찾기</button>
          <button class="text-btn accent" id="goSignupBtn">회원가입 →</button>
        </div>
      </div>

      <div id="viewSignup" class="view">
        <div class="view-title">회원가입</div>
        <form id="signupForm">
          <div class="field"><label>아이디</label><input id="signupUsername" type="text" placeholder="영문+숫자 4~20자" autocomplete="username" /><p class="field-hint">영문자 + 숫자만 사용 (4~20자)</p></div>
          <div class="field"><label>비밀번호</label><input id="signupPassword" type="password" placeholder="영문+숫자+특수문자 8자 이상" autocomplete="new-password" /><p class="field-hint">영문 + 숫자 + 특수문자(!@#$ 등) 8자 이상</p></div>
          <div class="field"><label>비밀번호 확인</label><input id="signupPasswordConfirm" type="password" placeholder="비밀번호 재입력" autocomplete="new-password" /></div>
          <div class="field"><label>이름 (닉네임)</label><input id="signupName" type="text" placeholder="표시될 이름" /></div>
          <div class="field"><label>전화번호</label><input id="signupPhone" type="tel" placeholder="01012345678" /><p class="field-hint">비밀번호 분실 시 본인 확인에 사용</p></div>
          <button type="submit" class="btn" id="signupBtn">가입하기</button>
        </form>
        <div class="toggle-row">이미 계정이 있으신가요? <button class="text-btn accent" id="goLoginBtn">로그인</button></div>
      </div>

      <div id="viewReset1" class="view">
        <div class="step-bar"><div class="step-dot on"></div><div class="step-dot"></div></div>
        <div class="view-title">비밀번호 찾기</div>
        <form id="resetVerifyForm">
          <div class="field"><label>아이디</label><input id="resetUsername" type="text" placeholder="가입한 아이디" /></div>
          <div class="field"><label>전화번호</label><input id="resetPhone" type="tel" placeholder="가입 시 등록한 전화번호" /></div>
          <button type="submit" class="btn" id="resetVerifyBtn">본인 확인</button>
        </form>
        <div class="link-row" style="justify-content:center;margin-top:14px;">
          <button class="text-btn" id="backToLoginBtn">← 로그인으로 돌아가기</button>
        </div>
      </div>

      <div id="viewReset2" class="view">
        <div class="step-bar"><div class="step-dot"></div><div class="step-dot on"></div></div>
        <div class="view-title">새 비밀번호 설정</div>
        <form id="resetPasswordForm">
          <input type="hidden" id="resetToken" />
          <div class="field"><label>새 비밀번호</label><input id="newPassword" type="password" placeholder="영문+숫자+특수문자 8자 이상" autocomplete="new-password" /></div>
          <div class="field"><label>비밀번호 확인</label><input id="newPasswordConfirm" type="password" placeholder="새 비밀번호 재입력" autocomplete="new-password" /></div>
          <button type="submit" class="btn" id="resetPasswordBtn">비밀번호 변경</button>
        </form>
      </div>
    </div>
    <script src="auth.js"></script>
  </body>
</html>
