<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiya | 프로필</title>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/audiya_logo.png" />
    <style>
      :root {
        --bg: linear-gradient(160deg,#f0f2ff,#ece9ff 40%,#f5eeff 75%,#fff0fb);
        --surface: rgba(255,255,255,0.9);
        --border: rgba(139,92,246,0.15);
        --text: #1e1b3a; --muted: #6b7280; --sub: #9ca3af;
        --primary: #6366f1; --secondary: #8b5cf6;
        --input-bg: rgba(255,255,255,0.8); --input-border: rgba(99,102,241,0.2);
        --divider: rgba(139,92,246,0.1);
        --err-bg: rgba(220,38,38,0.07); --err-text: #dc2626;
        --ok-bg: rgba(22,163,74,0.07); --ok-text: #16a34a;
        --del-bg: rgba(220,38,38,0.07); --del-text: #dc2626; --del-border: rgba(220,38,38,0.2);
        --card-shadow: 0 4px 24px rgba(99,102,241,0.08);
        --chip-bg: #eef2ff; --chip-border: #c7d2fe; --chip-text: #4338ca;
        --hero1: #6366f1; --hero2: #8b5cf6;
      }
      [data-theme="dark"] {
        --bg: linear-gradient(160deg,#08070f,#0e0b1c 40%,#12091e 75%,#140b1c);
        --surface: rgba(18,15,38,0.92); --border: rgba(167,139,250,0.2);
        --text: #e2e0f0; --muted: #9ca3af; --sub: #6b7280;
        --primary: #818cf8; --secondary: #a78bfa;
        --input-bg: rgba(14,11,28,0.8); --input-border: rgba(129,140,248,0.26);
        --divider: rgba(167,139,250,0.12);
        --err-bg: rgba(220,38,38,0.12); --err-text: #f87171;
        --ok-bg: rgba(22,163,74,0.12); --ok-text: #4ade80;
        --del-bg: rgba(220,38,38,0.12); --del-text: #f87171; --del-border: rgba(248,113,113,0.3);
        --card-shadow: 0 4px 24px rgba(0,0,0,0.4);
        --chip-bg: rgba(99,102,241,0.18); --chip-border: rgba(129,140,248,0.35); --chip-text: #c7d2fe;
        --hero1: #4f46e5; --hero2: #7c3aed;
      }
      *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { font-family:"Noto Sans KR",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
      body::before {
        content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
        background: radial-gradient(80% 60% at 15% 10%, rgba(99,102,241,0.07) 0%, transparent 65%),
                    radial-gradient(70% 55% at 85% 80%, rgba(139,92,246,0.09) 0%, transparent 65%);
      }

      /* 상단 바 */
      .top-bar {
        background:var(--surface); border-bottom:1px solid var(--border);
        padding:0 32px; height:62px; display:flex; align-items:center;
        justify-content:space-between; position:sticky; top:0; z-index:50;
        backdrop-filter:blur(24px); box-shadow:0 1px 20px rgba(99,102,241,0.06);
      }
      .top-bar a { display:flex; align-items:center; gap:6px; text-decoration:none; color:var(--muted); font-size:13px; font-weight:500; transition:color 0.2s; }
      .top-bar a:hover { color:var(--primary); }
      .top-brand { font-family:"Space Grotesk",sans-serif; font-size:19px; font-weight:800; letter-spacing:0.12em; background:linear-gradient(135deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; user-select:none; }
      .logout-btn { position:relative; overflow:hidden; background:none; border:1.5px solid var(--border); border-radius:8px; padding:6px 16px; font-size:12px; font-family:inherit; color:var(--muted); cursor:pointer; font-weight:600; transition:all 0.2s; box-shadow:none; margin:0; }
      .logout-btn:hover { border-color:var(--err-text); color:var(--err-text); background:var(--err-bg); transform:none; }

      /* 히어로 */
      .hero {
        background:linear-gradient(135deg,var(--hero1),var(--hero2));
        padding:44px 24px 36px; text-align:center; color:#fff;
        position:relative; overflow:hidden;
        animation: hero-in 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
      }
      @keyframes hero-in { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
      .hero::before {
        content:""; position:absolute; inset:0; pointer-events:none;
        background: radial-gradient(60% 80% at 50% 0%, rgba(255,255,255,0.1) 0%, transparent 70%);
      }
      .avatar-wrap { position:relative; width:76px; margin:0 auto 14px; z-index:1; }
      .avatar {
        width:76px; height:76px; border-radius:50%;
        background:rgba(255,255,255,0.2); border:2.5px solid rgba(255,255,255,0.5);
        display:flex; align-items:center; justify-content:center;
        font-family:"Space Grotesk",sans-serif; font-size:28px; font-weight:700;
        position:relative; overflow:hidden;
        box-shadow:0 4px 20px rgba(0,0,0,0.15);
      }
      .avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
      .avatar-preview { width:72px; height:72px; border-radius:50%; object-fit:cover; border:2px solid var(--border); display:block; margin:0 auto 12px; background:var(--input-bg); }
      .avatar-preview-fallback { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(139,92,246,0.15)); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 12px; font-family:"Space Grotesk",sans-serif; font-weight:700; color:var(--primary); }
      .btn-photo { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; background:var(--input-bg); border:1.5px solid var(--input-border); border-radius:10px; font-size:13px; font-weight:600; font-family:inherit; color:var(--text); cursor:pointer; transition:border-color 0.2s, background 0.2s; }
      .btn-photo:hover { border-color:var(--primary); background:var(--chip-bg); }
      .hero-name { font-family:"Space Grotesk",sans-serif; font-size:22px; font-weight:800; margin-bottom:4px; position:relative; z-index:1; }
      .hero-id { font-size:13px; opacity:0.75; position:relative; z-index:1; }

      /* 탭 */
      .tab-wrap {
        background:var(--surface); border-bottom:1px solid var(--border);
        display:flex; max-width:740px; margin:0 auto;
        backdrop-filter:blur(12px); position:sticky; top:62px; z-index:40;
      }
      .tab-btn { flex:1; padding:15px 0; background:none; border:none; font-family:inherit; font-size:14px; font-weight:500; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; box-shadow:none; margin:0; position:relative; overflow:hidden; }
      .tab-btn.active { color:var(--primary); border-color:var(--primary); font-weight:700; }
      .tab-btn:hover:not(.active) { color:var(--primary); background:rgba(99,102,241,0.04); }

      .content { max-width:740px; margin:0 auto; padding:28px 16px 80px; }
      .panel { display:none; animation: panel-in 0.4s cubic-bezier(0.16,1,0.3,1); }
      .panel.active { display:block; }
      @keyframes panel-in { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

      .section-card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px; margin-bottom:14px; box-shadow:var(--card-shadow); backdrop-filter:blur(12px); transition:box-shadow 0.2s; }
      .section-card:hover { box-shadow:0 6px 28px rgba(99,102,241,0.1); }
      .section-title { font-family:"Space Grotesk",sans-serif; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--divider); text-transform:uppercase; letter-spacing:0.6px; }
      .info-row { display:flex; align-items:center; padding:11px 0; border-bottom:1px solid var(--divider); gap:12px; }
      .info-row:last-child { border-bottom:none; }
      .info-label { font-size:12px; color:var(--sub); width:80px; flex-shrink:0; font-weight:600; }
      .info-value { font-size:14px; color:var(--text); flex:1; font-weight:500; }

      .field { margin-bottom:13px; }
      .field label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; letter-spacing:0.02em; }
      .field input { width:100%; padding:11px 14px; border:1.5px solid var(--input-border); border-radius:10px; font-size:14px; font-family:inherit; background:var(--input-bg); color:var(--text); transition:border-color 0.2s,box-shadow 0.2s; }
      .field input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.15); }
      .field input:hover:not(:focus) { border-color:rgba(99,102,241,0.35); }
      .field input::placeholder { color:var(--sub); }

      .btn-save { position:relative; overflow:hidden; padding:10px 22px; background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; border:none; border-radius:10px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; box-shadow:0 4px 14px rgba(99,102,241,0.3); transition:opacity 0.2s,transform 0.18s; }
      .btn-save:hover:not(:disabled) { opacity:0.9; transform:translateY(-1px); }
      .btn-save:active:not(:disabled) { transform:scale(0.97); transition-duration:0.06s; }
      .btn-save:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

      .alert { padding:10px 13px; border-radius:9px; font-size:13px; margin-top:12px; display:none; }
      .alert.show { display:block; }
      .alert-error { background:var(--err-bg); color:var(--err-text); border-left:3px solid var(--err-text); }
      .alert-success { background:var(--ok-bg); color:var(--ok-text); border-left:3px solid var(--ok-text); }

      .pl-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
      .pl-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--card-shadow); transition:transform 0.2s,box-shadow 0.2s,border-color 0.2s; cursor:pointer; backdrop-filter:blur(8px); }
      .pl-card:hover { transform:translateY(-4px); box-shadow:0 10px 28px rgba(99,102,241,0.13); border-color:var(--primary); }
      .pl-thumb { width:100%; aspect-ratio:1; background:linear-gradient(135deg,rgba(99,102,241,0.12),rgba(139,92,246,0.12)); display:flex; align-items:center; justify-content:center; font-size:36px; overflow:hidden; }
      .pl-thumb img { width:100%; height:100%; object-fit:cover; transition:transform 0.3s; }
      .pl-card:hover .pl-thumb img { transform:scale(1.05); }
      .pl-info { padding:12px; }
      .pl-name { font-size:13px; font-weight:700; color:var(--text); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .pl-meta { font-size:11px; color:var(--sub); }

      .empty-state { text-align:center; padding:60px 20px; color:var(--sub); font-size:14px; line-height:1.7; }
      .empty-state .icon { font-size:44px; margin-bottom:14px; }
      .loading { text-align:center; padding:40px; color:var(--sub); font-size:14px; }

      /* 모달 */
      .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:100; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(6px); }
      .modal-overlay.open { display:flex; animation:modal-in 0.25s cubic-bezier(0.16,1,0.3,1); }
      @keyframes modal-in { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:scale(1)} }
      .modal-box { background:var(--surface); border:1px solid var(--border); border-radius:20px; width:100%; max-width:480px; max-height:82vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,0.3); backdrop-filter:blur(24px); }
      .modal-head { padding:18px 20px; border-bottom:1px solid var(--divider); display:flex; align-items:center; justify-content:space-between; }
      .modal-head h3 { font-size:15px; font-weight:700; color:var(--text); font-family:"Space Grotesk",sans-serif; }
      .modal-close { background:none; border:none; box-shadow:none; font-size:20px; color:var(--sub); cursor:pointer; line-height:1; padding:3px; margin:0; border-radius:6px; transition:color 0.2s,background 0.2s; }
      .modal-close:hover { color:var(--text); background:var(--chip-bg); transform:none; }
      .modal-body { overflow-y:auto; padding:14px 20px; flex:1; }
      .modal-track { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--divider); }
      .modal-track:last-child { border-bottom:none; }
      .m-num { color:var(--sub); font-size:11px; width:20px; text-align:right; flex-shrink:0; }
      .m-cover { width:36px; height:36px; border-radius:6px; object-fit:cover; background:var(--input-border); flex-shrink:0; }
      .m-title { font-size:13px; font-weight:600; color:var(--text); }
      .m-artist { font-size:11px; color:var(--sub); }
      .modal-foot { padding:14px 20px; border-top:1px solid var(--divider); display:flex; gap:8px; }
      .btn-delete { position:relative; overflow:hidden; flex:1; padding:11px; background:var(--del-bg); color:var(--del-text); border:1.5px solid var(--del-border); border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:none; transition:all 0.2s; margin:0; }
      .btn-delete:hover { background:var(--del-text); color:#fff; transform:none; }
      .btn-delete:active { transform:scale(0.97); transition-duration:0.06s; }
      .btn-cover-change { position:relative; overflow:hidden; padding:11px 16px; background:var(--chip-bg); color:var(--primary); border:1.5px solid var(--chip-border); border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:none; transition:all 0.2s; margin:0; white-space:nowrap; }
      .btn-cover-change:hover { background:var(--primary); color:#fff; border-color:var(--primary); transform:none; }

      /* 커버 변경 패널 */
      .cover-panel { display:none; flex-direction:column; height:100%; }
      .cover-panel.active { display:flex; }
      .cover-tabs { display:flex; border-bottom:1px solid var(--divider); }
      .cover-tab { flex:1; padding:11px 0; background:none; border:none; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-family:inherit; transition:all 0.2s; box-shadow:none; margin:0; }
      .cover-tab.active { color:var(--primary); border-color:var(--primary); font-weight:700; }
      .cover-tab-body { overflow-y:auto; flex:1; padding:16px 20px; }
      .cover-album-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
      .cover-album-item { aspect-ratio:1; border-radius:8px; overflow:hidden; cursor:pointer; border:2.5px solid transparent; transition:border-color 0.15s, transform 0.15s; background:var(--input-bg); }
      .cover-album-item:hover { transform:scale(1.04); }
      .cover-album-item.selected { border-color:var(--primary); }
      .cover-album-item img { width:100%; height:100%; object-fit:cover; display:block; }
      .cover-palette-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
      .cover-palette-item { aspect-ratio:1; border-radius:10px; cursor:pointer; border:2.5px solid transparent; transition:border-color 0.15s, transform 0.15s; }
      .cover-palette-item:hover { transform:scale(1.06); }
      .cover-palette-item.selected { border-color:#fff; box-shadow:0 0 0 2px var(--primary); }
      .cover-upload-zone { border:2px dashed var(--input-border); border-radius:12px; padding:32px 16px; text-align:center; cursor:pointer; transition:border-color 0.2s, background 0.2s; color:var(--muted); font-size:13px; }
      .cover-upload-zone:hover { border-color:var(--primary); background:rgba(99,102,241,0.04); }
      .cover-upload-preview { width:100%; max-height:180px; object-fit:cover; border-radius:10px; margin-top:12px; display:none; }
      .cover-apply-btn { position:relative; overflow:hidden; width:100%; padding:11px; background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; border:none; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:14px; transition:opacity 0.2s; }
      .cover-apply-btn:hover { opacity:0.9; }
      .cover-apply-btn:disabled { opacity:0.5; cursor:not-allowed; }
      .cover-back-btn { background:none; border:none; font-size:13px; color:var(--muted); cursor:pointer; padding:0; font-family:inherit; display:flex; align-items:center; gap:4px; box-shadow:none; transition:color 0.2s; margin:0; }
      .cover-back-btn:hover { color:var(--text); transform:none; }

      /* 리플 */
      @keyframes ripple { 0%{transform:scale(0);opacity:0.55} 100%{transform:scale(2.5);opacity:0} }
      .ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,0.3); pointer-events:none; animation:ripple 0.55s linear; }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <a href="/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>메인으로</a>
      <span class="top-brand">AUDIYA</span>
      <button class="logout-btn" id="logoutBtn">로그아웃</button>
    </div>

    <div class="hero">
      <div class="avatar-wrap">
        <div class="avatar" id="heroAvatar">?</div>
      </div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;" />
      <div class="hero-name" id="heroName">로딩 중...</div>
      <div class="hero-id" id="heroId">@—</div>
    </div>

    <div class="tab-wrap">
      <button class="tab-btn active" data-panel="panelInfo">회원정보</button>
      <button class="tab-btn" data-panel="panelPlaylists">내 플레이리스트</button>
      <button class="tab-btn" data-panel="panelLikes">좋아요</button>
    </div>

    <div class="content">
      <div class="panel active" id="panelInfo">
        <div class="section-card">
          <div class="section-title">프로필 사진</div>
          <div id="photoPreviewWrap"></div>
          <button type="button" class="btn-photo" id="photoChangeBtn">📷 사진 변경</button>
          <div class="alert alert-error" id="photoError"></div>
          <div class="alert alert-success" id="photoSuccess"></div>
        </div>
        <div class="section-card">
          <div class="section-title">기본 정보</div>
          <div class="info-row"><span class="info-label">아이디</span><span class="info-value" id="infoUsername">—</span></div>
          <div class="info-row"><span class="info-label">전화번호</span><span class="info-value" id="infoPhone">—</span></div>
        </div>
        <div class="section-card">
          <div class="section-title">이름 변경</div>
          <form id="nameForm">
            <div class="field"><label>새 이름 (닉네임)</label><input id="editName" type="text" placeholder="변경할 이름 입력" /></div>
            <button type="submit" class="btn-save" id="nameSaveBtn">저장하기</button>
          </form>
          <div class="alert alert-error" id="nameError"></div>
          <div class="alert alert-success" id="nameSuccess"></div>
        </div>
        <div class="section-card">
          <div class="section-title">비밀번호 변경</div>
          <form id="pwForm">
            <div class="field"><label>현재 비밀번호</label><input id="currentPw" type="password" placeholder="현재 비밀번호" autocomplete="current-password" /></div>
            <div class="field"><label>새 비밀번호</label><input id="newPw" type="password" placeholder="영문+숫자+특수문자 8자 이상" autocomplete="new-password" /></div>
            <div class="field"><label>새 비밀번호 확인</label><input id="newPwConfirm" type="password" placeholder="새 비밀번호 재입력" autocomplete="new-password" /></div>
            <button type="submit" class="btn-save" id="pwSaveBtn">비밀번호 변경</button>
          </form>
          <div class="alert alert-error" id="pwError"></div>
          <div class="alert alert-success" id="pwSuccess"></div>
        </div>
      </div>

      <div class="panel" id="panelPlaylists">
        <div class="loading" id="plLoading">불러오는 중...</div>
        <div class="pl-grid" id="plGrid" style="display:none;"></div>
        <div class="empty-state" id="plEmpty" style="display:none;"><div class="icon">🎵</div>저장된 플레이리스트가 없습니다.<br>메인에서 추천을 받고 저장해보세요!</div>
      </div>

      <div class="panel" id="panelLikes">
        <div class="loading" id="likeLoading">불러오는 중...</div>
        <div class="pl-grid" id="likeGrid" style="display:none;"></div>
        <div class="empty-state" id="likeEmpty" style="display:none;"><div class="icon">💜</div>좋아요한 플레이리스트가 없습니다.</div>
      </div>
    </div>

    <div class="modal-overlay" id="trackModal">
      <div class="modal-box">
        <div class="modal-head">
          <button class="cover-back-btn" id="coverBackBtn" style="display:none;">← 뒤로</button>
          <h3 id="modalTitle"></h3>
          <button class="modal-close" id="modalClose">✕</button>
        </div>

        <!-- 트랙 목록 패널 -->
        <div class="modal-body" id="modalTracks"></div>
        <div class="modal-foot" id="modalFoot">
          <button class="btn-cover-change" id="modalCoverBtn">🖼 표지 변경</button>
          <button class="btn-delete" id="modalDeleteBtn">삭제하기</button>
        </div>

        <!-- 커버 변경 패널 -->
        <div class="cover-panel" id="coverPanel">
          <div class="cover-tabs">
            <button class="cover-tab active" data-ctab="album">앨범 표지</button>
            <button class="cover-tab" data-ctab="color">색상 팔레트</button>
            <button class="cover-tab" data-ctab="upload">사진 업로드</button>
          </div>
          <div class="cover-tab-body">
            <div id="ctabAlbum"></div>
            <div id="ctabColor" style="display:none;"></div>
            <div id="ctabUpload" style="display:none;">
              <div class="cover-upload-zone" id="coverUploadZone">
                📁 클릭해서 이미지 선택
              </div>
              <img class="cover-upload-preview" id="coverUploadPreview" alt="미리보기" />
            </div>
          </div>
          <div style="padding:0 20px 16px;">
            <button class="cover-apply-btn" id="coverApplyBtn">적용하기</button>
          </div>
        </div>

        <input type="file" id="coverFileInput" accept="image/*" style="display:none;" />
      </div>
    </div>

    <script src="profile.js"></script>
    <script>
      document.addEventListener('click', function(e) {
        const btn = e.target.closest('button:not(:disabled)');
        if (!btn) return;
        const rect = btn.getBoundingClientRect();
        const r = document.createElement('span');
        r.className = 'ripple';
        const size = Math.max(rect.width, rect.height);
        r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
        btn.appendChild(r);
        r.addEventListener('animationend', () => r.remove());
      });
    </script>
  </body>
</html>
