<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiya | 직접 플레이리스트 만들기</title>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/audiya_logo.png" />
    <style>
      :root {
        --bg: linear-gradient(160deg,#f0f2ff,#ece9ff 40%,#f5eeff 75%,#fff0fb);
        --surface: rgba(255,255,255,0.9);
        --border: rgba(139,92,246,0.15);
        --text: #1e1b3a; --muted: #6b7280; --sub: #9ca3af;
        --primary: #6366f1; --secondary: #8b5cf6;
        --input-bg: rgba(255,255,255,0.8); --input-border: rgba(99,102,241,0.2);
        --divider: rgba(139,92,246,0.1);
        --card-shadow: 0 4px 24px rgba(99,102,241,0.08);
        --chip-bg: #eef2ff; --chip-border: #c7d2fe; --chip-text: #4338ca;
      }
      [data-theme="dark"] {
        --bg: linear-gradient(160deg,#08070f,#0e0b1c 40%,#12091e 75%,#140b1c);
        --surface: rgba(18,15,38,0.92); --border: rgba(167,139,250,0.2);
        --text: #e2e0f0; --muted: #9ca3af; --sub: #6b7280;
        --primary: #818cf8; --secondary: #a78bfa;
        --input-bg: rgba(14,11,28,0.8); --input-border: rgba(129,140,248,0.26);
        --divider: rgba(167,139,250,0.12);
        --card-shadow: 0 4px 24px rgba(0,0,0,0.4);
        --chip-bg: rgba(99,102,241,0.18); --chip-border: rgba(129,140,248,0.35); --chip-text: #c7d2fe;
      }
      *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body {
        font-family:"Noto Sans KR",system-ui,sans-serif;
        background:var(--bg); color:var(--text); min-height:100vh;
      }
      body::before {
        content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
        background: radial-gradient(80% 60% at 15% 10%, rgba(99,102,241,0.07) 0%, transparent 65%),
                    radial-gradient(70% 55% at 85% 80%, rgba(139,92,246,0.09) 0%, transparent 65%);
      }

      /* Top bar */
      .top-bar {
        background:var(--surface); border-bottom:1px solid var(--border);
        padding:0 32px; height:62px; display:flex; align-items:center;
        justify-content:space-between; position:sticky; top:0; z-index:50;
        backdrop-filter:blur(24px); box-shadow:0 1px 20px rgba(99,102,241,0.06);
      }
      .top-bar a { display:flex; align-items:center; gap:6px; text-decoration:none; color:var(--muted); font-size:13px; font-weight:500; transition:color 0.2s; }
      .top-bar a:hover { color:var(--primary); }
      .nav-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; cursor:pointer; transition:transform 0.2s,box-shadow 0.2s; text-decoration:none; box-shadow:0 2px 10px rgba(99,102,241,0.35); flex-shrink:0; overflow:hidden; }
      .nav-avatar:hover { transform:scale(1.08); box-shadow:0 4px 16px rgba(99,102,241,0.45); }
      .nav-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
      .top-brand { font-family:"Space Grotesk",sans-serif; font-size:19px; font-weight:800; letter-spacing:0.12em; background:linear-gradient(135deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; user-select:none; }

      /* Layout */
      .page-body {
        display:grid;
        grid-template-columns:1fr 1fr 1.3fr;
        gap:16px;
        padding:20px;
        min-height:calc(100vh - 62px);
        align-items:start;
      }

      /* Card */
      .col-card {
        background:var(--surface); border:1px solid var(--border);
        border-radius:18px; padding:0; box-shadow:var(--card-shadow);
        backdrop-filter:blur(12px); overflow:auto;
        display:flex; flex-direction:column;
      }
      #buildList { max-height:320px; overflow-y:auto; }
      #buildList::-webkit-scrollbar { width:4px; }
      #buildList::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
      .card-head {
        padding:16px 18px 14px;
        border-bottom:1px solid var(--divider);
        display:flex; align-items:center; justify-content:space-between; gap:10px;
      }
      .card-head h2 {
        font-family:"Space Grotesk",sans-serif;
        font-size:14px; font-weight:700; color:var(--text);
      }
      .track-count-badge {
        font-size:11px; font-weight:700; color:var(--chip-text);
        background:var(--chip-bg); border:1px solid var(--chip-border);
        border-radius:99px; padding:2px 8px;
      }
      .card-body { padding:14px 18px; flex:1; }

      /* Select */
      .pl-select {
        width:100%; padding:9px 12px;
        border:1.5px solid var(--input-border); border-radius:10px;
        font-size:13px; font-family:inherit; background:var(--input-bg); color:var(--text);
        outline:none; cursor:pointer; transition:border-color 0.2s;
        margin-bottom:12px;
      }
      .pl-select:focus { border-color:var(--primary); }

      /* Track list (source) */
      .track-list { display:flex; flex-direction:column; gap:4px; max-height:420px; overflow-y:auto; }
      .track-row {
        display:flex; align-items:center; gap:10px;
        padding:8px 10px; border-radius:10px;
        cursor:grab; transition:background 0.15s;
        border:1.5px solid transparent;
        user-select:none;
      }
      .track-row:hover { background:rgba(99,102,241,0.1); border-color:var(--input-border); }
      .track-row.dragging { opacity:0.45; }
      .track-cover {
        width:36px; height:36px; border-radius:7px;
        object-fit:cover; flex-shrink:0;
        background:var(--input-border);
      }
      .track-info { flex:1; min-width:0; }
      .track-title { font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .track-artist { font-size:11px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

      /* Search */
      .search-row { display:flex; gap:6px; margin-bottom:12px; }
      .search-input {
        flex:1; padding:9px 12px;
        border:1.5px solid var(--input-border); border-radius:10px;
        font-size:13px; font-family:inherit; background:var(--input-bg); color:var(--text);
        outline:none; transition:border-color 0.2s;
      }
      .search-input:focus { border-color:var(--primary); }
      .search-input::placeholder { color:var(--sub); }
      .search-btn {
        padding:9px 14px; border-radius:10px;
        background:linear-gradient(135deg,var(--primary),var(--secondary));
        color:#fff; border:none; cursor:pointer; font-family:inherit;
        font-size:13px; font-weight:600; transition:opacity 0.2s;
        flex-shrink:0;
      }
      .search-btn:hover { opacity:0.88; }
      .search-btn:disabled { opacity:0.5; cursor:not-allowed; }
      .state-msg { text-align:center; padding:24px 12px; color:var(--sub); font-size:13px; }

      /* Drop zone */
      .drop-zone-wrap {
        min-height:200px; border:2px dashed var(--input-border);
        border-radius:12px; transition:border-color 0.2s, background 0.2s;
        display:flex; flex-direction:column;
      }
      .drop-zone-wrap.drag-over { border-color:var(--primary); background:rgba(99,102,241,0.05); }
      .drop-placeholder { flex:1; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:13px; pointer-events:none; padding:32px; text-align:center; }

      /* Built track row */
      .built-track {
        display:flex; align-items:center; gap:8px;
        padding:7px 8px; border-radius:9px;
        border:1.5px solid transparent;
        transition:background 0.15s; cursor:grab;
        user-select:none; position:relative;
      }
      .built-track:hover { background:rgba(99,102,241,0.1); border-color:var(--input-border); }
      .built-track.drag-over-top { border-top:2px solid var(--primary); }
      .built-track.drag-over-bottom { border-bottom:2px solid var(--primary); }
      .drag-handle { color:var(--sub); font-size:13px; cursor:grab; flex-shrink:0; line-height:1; padding:2px; }
      .remove-btn {
        background:none; border:none; color:var(--sub); cursor:pointer;
        font-size:14px; line-height:1; padding:2px 4px; border-radius:5px;
        transition:color 0.15s; flex-shrink:0; margin:0; box-shadow:none;
      }
      .remove-btn:hover { color:#ef4444; }

      /* Divider */
      .field-sep { border:none; border-top:1px solid var(--divider); margin:14px 0; }

      /* Name input */
      .pl-name-input {
        width:100%; padding:10px 12px;
        border:1.5px solid var(--input-border); border-radius:10px;
        font-size:14px; font-family:inherit; background:var(--input-bg); color:var(--text);
        outline:none; transition:border-color 0.2s, box-shadow 0.2s;
        margin-bottom:12px;
      }
      .pl-name-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.12); }
      .pl-name-input::placeholder { color:var(--sub); }

      /* Genre chips */
      .genre-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
      .genre-chip {
        padding:5px 12px; border-radius:99px; font-size:12px; font-weight:600;
        border:1.5px solid var(--chip-border); background:none; color:var(--muted);
        cursor:pointer; font-family:inherit; transition:all 0.15s; box-shadow:none; margin:0;
      }
      .genre-chip.active { background:var(--chip-bg); border-color:var(--primary); color:var(--chip-text); }

      /* Cover picker */
      .cover-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
      .cover-preview {
        width:80px; height:80px; border-radius:12px; flex-shrink:0;
        background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(139,92,246,0.15));
        border:1.5px solid var(--border); overflow:hidden;
        display:flex; align-items:center; justify-content:center;
        font-size:28px;
      }
      .cover-preview img { width:100%; height:100%; object-fit:cover; display:block; }
      .pick-cover-btn {
        flex:1; padding:10px 14px; border-radius:10px;
        border:1.5px solid var(--chip-border); background:var(--chip-bg);
        color:var(--chip-text); font-size:13px; font-weight:600;
        cursor:pointer; font-family:inherit; transition:all 0.2s; box-shadow:none; margin:0;
        text-align:left;
      }
      .pick-cover-btn:hover { border-color:var(--primary); background:var(--input-bg); }

      /* Save button */
      .save-btn {
        width:100%; padding:12px; border-radius:12px;
        background:linear-gradient(135deg,var(--primary),var(--secondary));
        color:#fff; border:none; font-size:14px; font-weight:700;
        cursor:pointer; font-family:inherit; transition:opacity 0.2s, transform 0.18s;
        box-shadow:0 4px 16px rgba(99,102,241,0.3);
      }
      .save-btn:hover:not(:disabled) { opacity:0.88; transform:translateY(-1px); }
      .save-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

      /* Field label */
      .field-label { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:7px; display:block; letter-spacing:0.02em; }

      /* Modal overlay */
      .modal-overlay {
        display:none; position:fixed; inset:0;
        background:rgba(0,0,0,0.55); z-index:200;
        align-items:center; justify-content:center; padding:20px;
        backdrop-filter:blur(6px);
      }
      .modal-overlay.open { display:flex; animation:modal-in 0.25s cubic-bezier(0.16,1,0.3,1); }
      @keyframes modal-in { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:scale(1)} }
      .modal-box {
        background:var(--surface); border:1px solid var(--border);
        border-radius:20px; width:100%; max-width:460px; max-height:82vh;
        display:flex; flex-direction:column; overflow:hidden;
        box-shadow:0 24px 70px rgba(0,0,0,0.3); backdrop-filter:blur(24px);
      }
      .modal-head {
        padding:18px 20px; border-bottom:1px solid var(--divider);
        display:flex; align-items:center; justify-content:space-between;
      }
      .modal-head h3 { font-size:15px; font-weight:700; color:var(--text); font-family:"Space Grotesk",sans-serif; }
      .modal-close {
        background:none; border:none; box-shadow:none; font-size:20px;
        color:var(--sub); cursor:pointer; line-height:1; padding:3px; margin:0;
        border-radius:6px; transition:color 0.2s, background 0.2s;
      }
      .modal-close:hover { color:var(--text); background:var(--chip-bg); }

      /* Cover tabs */
      .cover-tabs { display:flex; border-bottom:1px solid var(--divider); }
      .cover-tab {
        flex:1; padding:11px 0; background:none; border:none; border-bottom:2px solid transparent;
        font-size:13px; font-weight:500; color:var(--muted); cursor:pointer;
        font-family:inherit; transition:all 0.2s; box-shadow:none; margin:0;
      }
      .cover-tab.active { color:var(--primary); border-color:var(--primary); font-weight:700; }
      .cover-tab-body { overflow-y:auto; flex:1; padding:16px 20px; }
      .cover-tab-pane { display:none; }
      .cover-tab-pane.active { display:block; }
      .cover-album-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
      .cover-album-item {
        aspect-ratio:1; border-radius:8px; overflow:hidden; cursor:pointer;
        border:2.5px solid transparent; transition:border-color 0.15s, transform 0.15s;
        background:var(--input-bg);
      }
      .cover-album-item:hover { transform:scale(1.04); }
      .cover-album-item.selected { border-color:var(--primary); }
      .cover-album-item img { width:100%; height:100%; object-fit:cover; display:block; }
      .cover-palette-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
      .cover-palette-item {
        aspect-ratio:1; border-radius:10px; cursor:pointer;
        border:2.5px solid transparent; transition:border-color 0.15s, transform 0.15s;
        position:relative; display:flex; align-items:flex-end; padding:4px;
      }
      .cover-palette-item:hover { transform:scale(1.06); }
      .cover-palette-item.selected { border-color:#fff; box-shadow:0 0 0 2px var(--primary); }
      .cover-palette-label { font-size:9px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.4); line-height:1; }
      .cover-upload-zone {
        border:2px dashed var(--input-border); border-radius:12px;
        padding:32px 16px; text-align:center; cursor:pointer;
        transition:border-color 0.2s, background 0.2s; color:var(--muted); font-size:13px;
      }
      .cover-upload-zone:hover { border-color:var(--primary); background:rgba(99,102,241,0.04); }
      .cover-upload-preview { width:100%; max-height:160px; object-fit:cover; border-radius:10px; margin-top:12px; display:none; }
      .cover-apply-btn {
        width:100%; padding:11px; margin-top:14px;
        background:linear-gradient(135deg,var(--primary),var(--secondary));
        color:#fff; border:none; border-radius:9px; font-size:13px; font-weight:700;
        cursor:pointer; font-family:inherit; transition:opacity 0.2s; box-shadow:none;
      }
      .cover-apply-btn:hover { opacity:0.9; }
      .cover-apply-btn:disabled { opacity:0.5; cursor:not-allowed; }
      .empty-album { color:var(--sub); font-size:13px; text-align:center; padding:20px 0; }

      /* Toast */
      .toast {
        position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px);
        background:rgba(30,27,58,0.93); color:#fff; padding:10px 20px; border-radius:10px;
        font-size:13px; font-weight:600; opacity:0; pointer-events:none;
        transition:opacity 0.25s, transform 0.25s; z-index:999; white-space:nowrap;
        backdrop-filter:blur(8px);
      }
      [data-theme="dark"] .toast { background:rgba(226,224,240,0.95); color:#1e1b3a; }
      .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

      /* Scrollbar */
      ::-webkit-scrollbar { width:4px; }
      ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

      /* Responsive */
      @media (max-width:900px) {
        .page-body { grid-template-columns:1fr; }
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <a href="/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>메인으로</a>
      <span class="top-brand">AUDIYA</span>
      <a href="/profile.html" id="profileLink" style="display:none; text-decoration:none;">
        <div id="profileAvatar" class="nav-avatar"></div>
      </a>
    </div>

    <div class="page-body">
      <!-- Column 1: My playlists -->
      <div class="col-card">
        <div class="card-head">
          <h2>내 플레이리스트</h2>
        </div>
        <div class="card-body">
          <select id="plSelect" class="pl-select">
            <option value="">불러올 플레이리스트 선택</option>
          </select>
          <div id="plTrackList" class="track-list">
            <p class="state-msg">플레이리스트를 선택하세요</p>
          </div>
        </div>
      </div>

      <!-- Column 2: Search -->
      <div class="col-card">
        <div class="card-head">
          <h2>노래 검색</h2>
        </div>
        <div class="card-body">
          <div class="search-row">
            <input id="searchInput" class="search-input" type="text" placeholder="제목 또는 아티스트 검색..." />
            <button id="searchBtn" class="search-btn" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
          </div>
          <div id="searchResults" class="track-list">
            <p class="state-msg">검색어를 입력하세요</p>
          </div>
        </div>
      </div>

      <!-- Column 3: Build -->
      <div class="col-card">
        <div class="card-head">
          <h2>내 플레이리스트</h2>
          <span id="trackCountBadge" class="track-count-badge">0곡</span>
        </div>
        <div class="card-body">
          <div id="dropZone" class="drop-zone-wrap">
            <div id="dropPlaceholder" class="drop-placeholder">여기에 곡을 드래그하세요</div>
            <div id="buildList"></div>
          </div>

          <hr class="field-sep" />

          <label class="field-label" for="plNameInput">플레이리스트 이름</label>
          <input id="plNameInput" class="pl-name-input" type="text" placeholder="이름을 입력하세요" />

          <label class="field-label">장르 <span style="color:var(--sub);font-weight:400;">(최대 3개)</span></label>
          <div id="genreChips" class="genre-chips"></div>

          <label class="field-label">앨범 표지</label>
          <div class="cover-row">
            <div id="coverPreview" class="cover-preview">🎵</div>
            <button id="pickCoverBtn" class="pick-cover-btn" type="button">표지 선택</button>
          </div>

          <button id="saveBtn" class="save-btn" type="button">저장하기</button>
        </div>
      </div>
    </div>

    <!-- Cover picker modal -->
    <div id="coverModal" class="modal-overlay">
      <div class="modal-box">
        <div class="modal-head">
          <h3>앨범 표지 선택</h3>
          <button id="modalClose" class="modal-close" type="button">✕</button>
        </div>
        <div class="cover-tabs">
          <button class="cover-tab active" data-tab="album" type="button">앨범 표지</button>
          <button class="cover-tab" data-tab="color" type="button">색상 팔레트</button>
          <button class="cover-tab" data-tab="upload" type="button">사진 업로드</button>
        </div>
        <div class="cover-tab-body">
          <div id="tabAlbum" class="cover-tab-pane active">
            <div id="albumGrid" class="cover-album-grid"></div>
          </div>
          <div id="tabColor" class="cover-tab-pane">
            <div id="paletteGrid" class="cover-palette-grid"></div>
          </div>
          <div id="tabUpload" class="cover-tab-pane">
            <div id="uploadZone" class="cover-upload-zone">
              <div>사진을 클릭하거나 드래그하여 업로드</div>
              <div style="font-size:11px;margin-top:6px;color:var(--sub);">JPG, PNG, WEBP (최대 5MB)</div>
            </div>
            <input type="file" id="uploadInput" accept="image/*" style="display:none;" />
            <img id="uploadPreview" class="cover-upload-preview" alt="" />
          </div>
        </div>
        <div style="padding:0 20px 16px;">
          <button id="applyBtn" class="cover-apply-btn" type="button">적용하기</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="auth-app.js"></script>
    <script src="create.js"></script>
  </body>
</html>
