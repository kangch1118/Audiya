<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiya | 로그인 처리 중</title>
    <script src="theme.js"></script>
    <style>
      :root { --bg: linear-gradient(160deg,#f0f2ff,#ece9ff 40%,#f5eeff); --text: #1e1b3a; --primary: #6366f1; }
      [data-theme="dark"] { --bg: linear-gradient(160deg,#08070f,#0e0b1c); --text: #e2e0f0; }
      * { margin:0; padding:0; box-sizing:border-box; }
      body { font-family:"Noto Sans KR",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
      .card { text-align:center; }
      .spinner { width:44px; height:44px; border:3px solid rgba(99,102,241,0.2); border-top-color:#6366f1; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 20px; }
      @keyframes spin { to { transform:rotate(360deg); } }
      p { font-size:15px; color:var(--text); opacity:0.7; }
      .err { color:#f87171; margin-top:12px; font-size:13px; }
      a { color:var(--primary); text-decoration:none; font-size:13px; }
    </style>
    <link rel="icon" type="image/png" href="/audiya_logo.png" />
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <p>로그인 처리 중...</p>
      <div class="err" id="errMsg"></div>
      <a href="/login.html" id="backLink" style="display:none;margin-top:14px;">← 로그인으로 돌아가기</a>
    </div>

    <!-- Supabase JS (Google/GitHub OAuth 세션 처리용) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
      const SUPABASE_URL = "https://aihosblngsyezeqcmspg.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_Yygl54Kw3jLnReThtJdfCA_NZDmxSXD";

      function showError(msg) {
        document.getElementById("errMsg").textContent = msg;
        document.getElementById("backLink").style.display = "block";
        document.querySelector(".spinner").style.display = "none";
      }

      function saveAndRedirect(token, username, name) {
        localStorage.setItem("authToken", token);
        localStorage.setItem("authUsername", username);
        localStorage.setItem("authName", name || username);
        window.location.href = "/";
      }

      async function handleCallback() {
        // 네이버 콜백 (쿼리 파라미터로 전달)
        const params = new URLSearchParams(window.location.search);
        if (params.get("token")) {
          saveAndRedirect(params.get("token"), params.get("username"), params.get("name"));
          return;
        }
        if (params.get("error")) {
          showError("로그인 실패. 다시 시도해주세요.");
          return;
        }

        // Google/GitHub 콜백 (Supabase 세션)
        try {
          const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          const { data: { session }, error } = await sb.auth.getSession();

          if (error || !session) {
            showError("세션을 가져올 수 없습니다. 다시 시도해주세요.");
            return;
          }

          const user = session.user;
          const provider = user.app_metadata?.provider || "oauth";
          const name = user.user_metadata?.full_name
            || user.user_metadata?.name
            || user.user_metadata?.user_name
            || user.email?.split("@")[0]
            || "User";

          const res = await fetch("/api/auth/oauth/sync", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              provider,
              providerId: user.id,
              email: user.email,
              name,
            }),
          });

          const data = await res.json();
          await sb.auth.signOut(); // Supabase 세션은 정리 (우리 자체 토큰 사용)

          if (data.success) {
            saveAndRedirect(data.token, data.username, data.name);
          } else {
            showError(data.message || "계정 처리 실패");
          }
        } catch (err) {
          showError("오류 발생: " + err.message);
        }
      }

      handleCallback();
    </script>
  </body>
</html>
