<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiya | 커뮤니티</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="theme.js"></script>
    <link rel="icon" type="image/png" href="/audiya_logo.png" />
    <style>
      :root {
        --bg: linear-gradient(160deg,#f0f2ff,#ece9ff 40%,#f5eeff 75%,#fff0fb);
        --surface: rgba(255,255,255,0.88);
        --border: rgba(139,92,246,0.16);
        --text: #1e1b3a; --muted: #6b7280; --sub: #9ca3af;
        --primary: #6366f1; --secondary: #8b5cf6;
        --input-bg: rgba(255,255,255,0.7); --input-border: rgba(99,102,241,0.2);
        --divider: rgba(139,92,246,0.1);
        --tab-inactive: rgba(255,255,255,0.5);
        --err-bg: rgba(220,38,38,0.07); --err-text: #dc2626;
        --ok-bg: rgba(22,163,74,0.07); --ok-text: #16a34a;
        --card-shadow: 0 2px 16px rgba(99,102,241,0.07);
        --chip-bg: #eef2ff; --chip-border: #c7d2fe; --chip-text: #4338ca;
      }
      [data-theme="dark"] {
        --bg: linear-gradient(160deg,#08070f,#0e0b1c 40%,#12091e 75%,#140b1c);
        --surface: rgba(18,15,38,0.9); --border: rgba(167,139,250,0.2);
        --text: #e2e0f0; --muted: #9ca3af; --sub: #6b7280;
        --primary: #818cf8; --secondary: #a78bfa;
        --input-bg: rgba(14,11,28,0.8); --input-border: rgba(129,140,248,0.26);
        --divider: rgba(167,139,250,0.12);
        --tab-inactive: rgba(18,15,38,0.5);
        --err-bg: rgba(220,38,38,0.12); --err-text: #f87171;
        --ok-bg: rgba(22,163,74,0.12); --ok-text: #4ade80;
        --card-shadow: 0 2px 16px rgba(0,0,0,0.4);
        --chip-bg: rgba(99,102,241,0.18); --chip-border: rgba(129,140,248,0.35); --chip-text: #c7d2fe;
      }
      *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { font-family:"Noto Sans KR",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
      body::before {
        content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
        background: radial-gradient(80% 60% at 15% 10%, rgba(99,102,241,0.08) 0%, transparent 65%),
                    radial-gradient(70% 55% at 85% 80%, rgba(139,92,246,0.1) 0%, transparent 65%);
      }

      /* 상단 바 */
      .top-bar {
        background:var(--surface); border-bottom:1px solid var(--border);
        padding:0 32px; height:62px; display:flex; align-items:center;
        justify-content:space-between; position:sticky; top:0; z-index:50;
        backdrop-filter:blur(24px); box-shadow:0 1px 20px rgba(99,102,241,0.06);
      }
      .top-bar a { display:flex; align-items:center; gap:6px; text-decoration:none; color:var(--muted); font-size:13px; font-weight:500; transition:color 0.2s; }
      .top-bar a:hover { color:var(--primary); }
      .top-brand { font-family:"Space Grotesk",sans-serif; font-size:19px; font-weight:800; letter-spacing:0.12em; background:linear-gradient(135deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; user-select:none; }
      .nav-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; cursor:pointer; transition:transform 0.2s,box-shadow 0.2s; text-decoration:none; box-shadow:0 2px 10px rgba(99,102,241,0.35); flex-shrink:0; overflow:hidden; }
      .nav-avatar:hover { transform:scale(1.08); box-shadow:0 4px 16px rgba(99,102,241,0.45); }
      .nav-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }

      /* 히어로 */
      .hero {
        padding:48px 24px 40px; text-align:center;
        background: linear-gradient(160deg, rgba(99,102,241,0.06) 0%, transparent 60%);
        border-bottom:1px solid var(--border);
        animation: hero-in 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
      }
      @keyframes hero-in { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
      .hero-tag {
        display:inline-flex; align-items:center; gap:7px;
        font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
        color:var(--primary); background:var(--chip-bg); border:1px solid var(--chip-border);
        border-radius:999px; padding:5px 14px; margin-bottom:16px;
      }
      .hero-tag::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--primary); flex-shrink:0; animation:dot-pulse 2s ease-in-out infinite; }
      @keyframes dot-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.6)} }
      .hero h1 { font-family:"Space Grotesk",sans-serif; font-size:clamp(22px,3vw,32px); font-weight:800; color:var(--text); margin-bottom:10px; letter-spacing:-0.02em; }
      .hero p { font-size:14px; color:var(--muted); max-width:480px; margin:0 auto; line-height:1.7; }

      /* 레이아웃 */
      .layout { display:grid; grid-template-columns:320px 1fr; gap:24px; max-width:1140px; margin:0 auto; padding:28px 24px 80px; }
      @media(max-width:820px) { .layout{grid-template-columns:1fr} }

      /* 공유 카드 */
      .card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:22px; margin-bottom:18px; box-shadow:var(--card-shadow); backdrop-filter:blur(12px); }
      .card-title { font-family:"Space Grotesk",sans-serif; font-size:14px; font-weight:700; color:var(--text); margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--divider); letter-spacing:-0.01em; }

      .tab-row { display:flex; margin-bottom:16px; border-radius:10px; overflow:hidden; border:1px solid var(--border); }
      .tab-btn { flex:1; padding:9px 0; background:var(--tab-inactive); border:none; font-family:inherit; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; transition:all 0.2s; box-shadow:none; margin:0; position:relative; overflow:hidden; }
      .tab-btn.active { background:var(--primary); color:#fff; font-weight:700; }
      .tab-btn:hover:not(.active) { background:var(--chip-bg); color:var(--primary); }

      .field { margin-bottom:12px; }
      .field label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; letter-spacing:0.02em; }
      .field input { width:100%; padding:9px 12px; border:1.5px solid var(--input-border); border-radius:8px; font-size:13px; font-family:inherit; background:var(--input-bg); color:var(--text); transition:border-color 0.2s, box-shadow 0.2s; }
      .field input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.15); }
      .field input::placeholder { color:var(--sub); }

      .btn-primary { position:relative; overflow:hidden; width:100%; padding:11px; background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; border:none; border-radius:10px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; margin-top:4px; box-shadow:0 4px 16px rgba(99,102,241,0.3); transition:opacity 0.2s,transform 0.18s; }
      .btn-primary:hover:not(:disabled) { opacity:0.9; transform:translateY(-1px); }
      .btn-primary:active:not(:disabled) { transform:scale(0.97); transition-duration:0.06s; }
      .btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

      .track-preview { background:var(--input-bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:12px; max-height:160px; overflow-y:auto; }
      .track-row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--divider); font-size:12px; }
      .track-row:last-child { border-bottom:none; }
      .t-num { color:var(--sub); width:18px; flex-shrink:0; text-align:right; }
      .t-cover { width:28px; height:28px; border-radius:4px; object-fit:cover; background:var(--border); flex-shrink:0; }
      .t-title { font-weight:600; color:var(--text); }
      .t-artist { color:var(--sub); font-size:11px; }

      .alert { padding:8px 12px; border-radius:8px; font-size:12px; margin-top:10px; display:none; }
      .alert.show { display:block; }
      .alert-error { background:var(--err-bg); color:var(--err-text); border-left:2px solid var(--err-text); }
      .alert-success { background:var(--ok-bg); color:var(--ok-text); border-left:2px solid var(--ok-text); }

      .saved-pl-list { max-height:280px; overflow-y:auto; }
      .saved-pl-item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--divider); transition:background 0.15s; }
      .saved-pl-item:last-child { border-bottom:none; }
      .saved-thumb { width:36px; height:36px; border-radius:6px; background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(139,92,246,0.15)); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; overflow:hidden; }
      .saved-thumb img { width:100%; height:100%; object-fit:cover; }
      .saved-info { flex:1; min-width:0; }
      .saved-name { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .saved-meta { font-size:11px; color:var(--sub); }
      .btn-share-small { position:relative; overflow:hidden; padding:5px 12px; background:var(--primary); color:#fff; border:none; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; flex-shrink:0; box-shadow:none; margin:0; transition:opacity 0.2s,transform 0.15s; }
      .btn-share-small:hover { opacity:0.85; transform:translateY(-1px); }

      /* 필터 바 */
      .filter-bar { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
      .genre-btn { position:relative; overflow:hidden; padding:6px 14px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface); font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; transition:all 0.2s; font-family:inherit; white-space:nowrap; box-shadow:none; margin:0; }
      .genre-btn.active { border-color:var(--primary); background:var(--primary); color:#fff; box-shadow:0 3px 12px rgba(99,102,241,0.28); }
      .genre-btn:hover:not(.active) { border-color:var(--primary); color:var(--primary); background:var(--chip-bg); transform:translateY(-1px); }
      .genre-btn:active { transform:scale(0.95); transition-duration:0.06s; }

      .section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
      .section-title { font-family:"Space Grotesk",sans-serif; font-size:16px; font-weight:800; color:var(--text); letter-spacing:-0.01em; }
      .sort-label { font-size:12px; color:var(--sub); background:var(--chip-bg); border:1px solid var(--chip-border); border-radius:999px; padding:3px 10px; font-weight:600; color:var(--chip-text); }

      /* 플레이리스트 카드 */
      .pl-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:14px; }
      .pl-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--card-shadow); cursor:pointer; transition:transform 0.2s,box-shadow 0.2s,border-color 0.2s; backdrop-filter:blur(8px); }
      .pl-card:hover { transform:translateY(-4px); box-shadow:0 10px 28px rgba(99,102,241,0.15); border-color:var(--primary); }
      .pl-thumb { width:100%; aspect-ratio:1; background:linear-gradient(135deg,rgba(99,102,241,0.1),rgba(139,92,246,0.1)); display:flex; align-items:center; justify-content:center; font-size:32px; overflow:hidden; }
      .pl-thumb img { width:100%; height:100%; object-fit:cover; transition:transform 0.3s; }
      .pl-card:hover .pl-thumb img { transform:scale(1.04); }
      .pl-body { padding:10px 12px; }
      .pl-name { font-size:13px; font-weight:700; color:var(--text); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .pl-owner { font-size:11px; color:var(--muted); margin-bottom:5px; }
      .pl-foot { display:flex; align-items:center; justify-content:space-between; }
      .pl-meta { font-size:11px; color:var(--sub); }
      .like-btn { background:none; border:none; box-shadow:none; margin:0; font-size:15px; cursor:pointer; padding:3px; line-height:1; transition:transform 0.2s; color:var(--text); }
      .like-btn:hover { transform:scale(1.3); }
      .like-btn:active { transform:scale(0.9); transition-duration:0.06s; }
      .del-btn { background:none; border:none; box-shadow:none; margin:0; font-size:13px; cursor:pointer; padding:2px 6px; color:var(--sub); transition:color 0.2s,background 0.2s; border-radius:4px; }
      .del-btn:hover { color:#f87171; background:rgba(220,38,38,0.08); transform:none; }

      .empty { text-align:center; padding:50px 20px; color:var(--sub); font-size:14px; }
      .loading { text-align:center; padding:40px; color:var(--sub); font-size:13px; }

      /* 모달 */
      .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:100; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(6px); }
      .modal-overlay.open { display:flex; animation:modal-in 0.25s cubic-bezier(0.16,1,0.3,1); }
      @keyframes modal-in { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:scale(1)} }
      .modal-box { background:var(--surface); border:1px solid var(--border); border-radius:20px; width:100%; max-width:460px; max-height:82vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,0.3); backdrop-filter:blur(24px); }
      .modal-head { padding:18px 20px; border-bottom:1px solid var(--divider); display:flex; align-items:center; justify-content:space-between; }
      .modal-head h3 { font-size:15px; font-weight:700; color:var(--text); font-family:"Space Grotesk",sans-serif; }
      .modal-close { background:none; border:none; box-shadow:none; margin:0; font-size:20px; color:var(--sub); cursor:pointer; line-height:1; padding:2px; border-radius:6px; transition:color 0.2s,background 0.2s; }
      .modal-close:hover { color:var(--text); background:var(--chip-bg); transform:none; }
      .modal-tracks { overflow-y:auto; padding:12px 20px; flex:1; }
      .modal-track { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--divider); transition:background 0.15s; border-radius:6px; }
      .modal-track:last-child { border-bottom:none; }
      .modal-num { color:var(--sub); font-size:11px; width:20px; text-align:right; flex-shrink:0; }
      .modal-cover { width:36px; height:36px; border-radius:6px; object-fit:cover; background:var(--border); flex-shrink:0; }
      .modal-info .mt { font-size:13px; font-weight:600; color:var(--text); }
      .modal-info .ma { font-size:11px; color:var(--sub); }
      .modal-foot { padding:14px 20px; border-top:1px solid var(--divider); }
      .btn-like-modal { position:relative; overflow:hidden; width:100%; padding:11px; background:var(--chip-bg); color:var(--primary); border:1.5px solid var(--chip-border); border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:none; transition:all 0.2s; margin:0; }
      .btn-like-modal:hover { background:var(--primary); color:#fff; border-color:var(--primary); transform:translateY(-1px); box-shadow:0 4px 14px rgba(99,102,241,0.3); }

      /* 장르 선택 칩 */
      .genre-picker { margin-top:12px; }
      .genre-picker > label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:7px; letter-spacing:0.02em; }
      .genre-chips { display:flex; flex-wrap:wrap; gap:6px; }
      .genre-chip { padding:5px 12px; border-radius:20px; border:1.5px solid var(--input-border); background:var(--input-bg); font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; transition:all 0.15s; font-family:inherit; box-shadow:none; margin:0; }
      .genre-chip.selected { border-color:var(--primary); background:var(--primary); color:#fff; }
      .genre-chip:hover:not(.selected) { border-color:var(--primary); color:var(--primary); }

      /* 카드 장르 태그 */
      .pl-genres { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:5px; }
      .pl-genre-tag { font-size:10px; font-weight:600; color:var(--chip-text); background:var(--chip-bg); border:1px solid var(--chip-border); border-radius:10px; padding:2px 7px; }
      .btn-edit-genre { background:none; border:none; box-shadow:none; margin:0; font-size:11px; cursor:pointer; padding:2px 5px; color:var(--sub); transition:color 0.2s; border-radius:4px; line-height:1; }
      .btn-edit-genre:hover { color:var(--primary); background:var(--chip-bg); transform:none; }
      .btn-edit-cover { background:none; border:none; box-shadow:none; margin:0; font-size:11px; cursor:pointer; padding:2px 5px; color:var(--sub); transition:color 0.2s; border-radius:4px; line-height:1; }
      .btn-edit-cover:hover { color:var(--primary); background:var(--chip-bg); transform:none; }

      /* 커버 변경 모달 */
      .cover-modal-tabs { display:flex; border-bottom:1px solid var(--divider); }
      .cover-modal-tab { flex:1; padding:11px 0; background:none; border:none; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-family:inherit; transition:all 0.2s; box-shadow:none; margin:0; }
      .cover-modal-tab.active { color:var(--primary); border-color:var(--primary); font-weight:700; }
      .cover-modal-body { overflow-y:auto; flex:1; padding:16px 20px; }
      .cover-album-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
      .cover-album-item { aspect-ratio:1; border-radius:8px; overflow:hidden; cursor:pointer; border:2.5px solid transparent; transition:border-color 0.15s,transform 0.15s; background:var(--input-bg); }
      .cover-album-item:hover { transform:scale(1.04); }
      .cover-album-item.selected { border-color:var(--primary); }
      .cover-album-item img { width:100%; height:100%; object-fit:cover; display:block; }
      .cover-palette-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
      .cover-palette-item { aspect-ratio:1; border-radius:10px; cursor:pointer; border:2.5px solid transparent; transition:border-color 0.15s,transform 0.15s; }
      .cover-palette-item:hover { transform:scale(1.06); }
      .cover-palette-item.selected { border-color:#fff; box-shadow:0 0 0 2px var(--primary); }
      .cover-upload-zone { border:2px dashed var(--input-border); border-radius:12px; padding:28px 16px; text-align:center; cursor:pointer; transition:border-color 0.2s,background 0.2s; color:var(--muted); font-size:13px; }
      .cover-upload-zone:hover { border-color:var(--primary); background:rgba(99,102,241,0.04); }
      .cover-upload-preview { width:100%; max-height:160px; object-fit:cover; border-radius:10px; margin-top:12px; display:none; }
      .cover-apply-btn { width:100%; padding:11px; background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; border:none; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; transition:opacity 0.2s; }
      .cover-apply-btn:hover { opacity:0.9; }
      .cover-apply-btn:disabled { opacity:0.5; cursor:not-allowed; }

      /* 리플 */
      @keyframes ripple { 0%{transform:scale(0);opacity:0.55} 100%{transform:scale(2.5);opacity:0} }
      .ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,0.3); pointer-events:none; animation:ripple 0.55s linear; }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <a href="/">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        메인으로
      </a>
      <span class="top-brand">AUDIYA</span>
      <a href="/profile.html" id="profileLink" style="display:none; text-decoration:none;">
        <div id="profileAvatar" class="nav-avatar"></div>
      </a>
    </div>

    <div class="hero">
      <div class="hero-tag">커뮤니티 플레이리스트</div>
      <h1>음악 취향을 나눠보세요</h1>
      <p>내 플레이리스트를 공유하고 다른 사람의 취향을 발견하세요</p>
    </div>

    <div class="layout">
      <div class="share-side">
        <div class="card" id="shareCard">
          <div class="card-title">플레이리스트 공유</div>
          <div class="tab-row">
            <button class="tab-btn active" id="tabPending">지금 만든 추천</button>
            <button class="tab-btn" id="tabSaved">내 저장 목록</button>
          </div>
          <div id="panelPending">
            <div id="pendingContent"></div>
            <div class="alert alert-error" id="shareError"></div>
            <div class="alert alert-success" id="shareSuccess"></div>
          </div>
          <div id="panelSaved" style="display:none;">
            <div class="saved-pl-list" id="savedPlList">
              <p style="color:var(--sub);font-size:13px;text-align:center;padding:20px;">불러오는 중...</p>
            </div>
            <div class="alert alert-error" id="savedShareError"></div>
            <div class="alert alert-success" id="savedShareSuccess"></div>
          </div>
        </div>
      </div>

      <div class="community-side">
        <div class="section-head">
          <span class="section-title">커뮤니티 플레이리스트</span>
          <span class="sort-label">인기순</span>
        </div>
        <div class="filter-bar">
          <button class="genre-btn active" data-genre="all">전체</button>
          <button class="genre-btn" data-genre="kpop">K-POP</button>
          <button class="genre-btn" data-genre="jpop">J-POP</button>
          <button class="genre-btn" data-genre="pop">POP</button>
          <button class="genre-btn" data-genre="hiphop">힙합</button>
          <button class="genre-btn" data-genre="rnb">R&amp;B</button>
          <button class="genre-btn" data-genre="band">밴드</button>
          <button class="genre-btn" data-genre="edm">EDM</button>
          <button class="genre-btn" data-genre="indie">인디</button>
          <button class="genre-btn" data-genre="ballad">발라드</button>
        </div>
        <div class="loading" id="communityLoading">불러오는 중...</div>
        <div class="pl-grid" id="communityGrid" style="display:none;"></div>
        <div class="empty" id="communityEmpty" style="display:none;">해당 장르의 플레이리스트가 없습니다</div>
      </div>
    </div>

    <div class="modal-overlay" id="trackModal">
      <div class="modal-box">
        <div class="modal-head">
          <h3 id="modalTitle"></h3>
          <button class="modal-close" id="modalClose">✕</button>
        </div>
        <div class="modal-tracks" id="modalTracks"></div>
        <div class="modal-foot">
          <button class="btn-like-modal" id="modalLikeBtn">💜 좋아요</button>
        </div>
      </div>
    </div>

    <!-- 공유 모달 -->
    <div class="modal-overlay" id="shareModal">
      <div class="modal-box" style="max-width:400px;">
        <div class="modal-head">
          <h3 id="shareModalTitle">공유하기</h3>
          <button class="modal-close" id="shareModalClose">✕</button>
        </div>
        <div style="padding:16px 20px 20px; overflow-y:auto;">
          <div style="margin-bottom:12px;">
            <label style="font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;">플레이리스트 이름</label>
            <input id="shareModalName" type="text" maxlength="80" style="width:100%;padding:9px 12px;border:1.5px solid var(--input-border);border-radius:9px;font-size:14px;font-family:inherit;background:var(--input-bg);color:var(--text);outline:none;" />
          </div>
          <div class="genre-picker">
            <label>장르 선택 <span style="color:var(--sub);font-weight:400;">(최대 3개)</span></label>
            <div class="genre-chips" id="shareModalGenreChips"></div>
          </div>
        </div>
        <div style="padding:0 20px 16px;">
          <button class="btn-primary" id="shareModalConfirm" style="width:100%;padding:11px;border-radius:10px;font-size:13px;font-weight:700;border:none;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;cursor:pointer;font-family:inherit;transition:opacity 0.2s;">공유하기</button>
        </div>
      </div>
    </div>

    <!-- 통합 편집 모달 (장르 + 표지) -->
    <div class="modal-overlay" id="editModal">
      <div class="modal-box" style="max-width:420px;">
        <div class="modal-head">
          <h3>플레이리스트 편집</h3>
          <button class="modal-close" id="editModalClose">✕</button>
        </div>
        <div class="cover-modal-tabs">
          <button class="cover-modal-tab active" data-etab="genre">장르 편집</button>
          <button class="cover-modal-tab" data-etab="cover">표지 변경</button>
        </div>
        <!-- 장르 탭 -->
        <div id="etabGenre" style="padding:16px 20px 0; overflow-y:auto;">
          <div class="genre-picker">
            <label>장르 선택 <span style="color:var(--sub);font-weight:400;">(최대 3개)</span></label>
            <div class="genre-chips" id="editGenreChips"></div>
          </div>
          <div style="padding:14px 0 16px;">
            <button class="cover-apply-btn" id="editGenreSaveBtn">저장</button>
          </div>
        </div>
        <!-- 표지 탭 -->
        <div id="etabCover" style="display:none; flex-direction:column; flex:1;">
          <div class="cover-modal-tabs" style="border-top:1px solid var(--divider);">
            <button class="cover-modal-tab active" data-ctab="album">앨범 표지</button>
            <button class="cover-modal-tab" data-ctab="color">색상 팔레트</button>
            <button class="cover-modal-tab" data-ctab="upload">사진 업로드</button>
          </div>
          <div class="cover-modal-body">
            <div id="cmTabAlbum"></div>
            <div id="cmTabColor" style="display:none;"></div>
            <div id="cmTabUpload" style="display:none;">
              <div class="cover-upload-zone" id="cmUploadZone">📁 클릭해서 이미지 선택</div>
              <img class="cover-upload-preview" id="cmUploadPreview" alt="미리보기" />
            </div>
          </div>
          <div style="padding:0 20px 16px;">
            <button class="cover-apply-btn" id="cmApplyBtn">적용하기</button>
          </div>
          <input type="file" id="cmFileInput" accept="image/*" style="display:none;" />
        </div>
      </div>
    </div>

    <script src="auth-app.js"></script>
    <script src="share.js"></script>
    <script>
      document.addEventListener('click', function(e) {
        const btn = e.target.closest('button:not(:disabled)');
        if (!btn) return;
        const rect = btn.getBoundingClientRect();
        const r = document.createElement('span');
        r.className = 'ripple';
        const size = Math.max(rect.width, rect.height);
        r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
        btn.appendChild(r);
        r.addEventListener('animationend', () => r.remove());
      });
    </script>
  </body>
</html>
